<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奄美大島満喫ツアー - 地図</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- ヘッダー -->
  <div class="header">
    <h1>🏝️ 奄美大島満喫ツアー 🐢</h1>
    <div class="subtitle">～ 旅の栞（進捗チェック版）～</div>
    <div class="header-actions">
      <a href="index.html" class="toggle-button" style="text-decoration: none;">← トップへ</a>
      <button class="toggle-button" id="theme-toggle" onclick="toggleTheme()">🌗 テーマ切替</button>
      <button class="toggle-button" id="print-btn">🖨️ 印刷</button>
    </div>
  </div>

  <!-- ナビゲーションメニュー -->
  <nav class="topnav">
    <a href="index.html">🏠 トップ</a>
    <a href="schedule.html">📅 詳細日程</a>
    <a href="map.html">🗺️ 地図</a>
  </nav>

  <!-- GoogleMapセクション -->
  <div class="section map-section" id="map-section">
    <h2>🗺️ 奄美大島の地図（FromTo）</h2>
    
    <!-- 経路検索パネル -->
    <div class="route-panel">
      <label for="route-from">From（出発地点）:</label>
      <select id="route-from">
        <option value="">選択してください</option>
      </select>
      
      <label for="route-to">To（到着地点）:</label>
      <select id="route-to">
        <option value="">選択してください</option>
      </select>
      
      <div class="transport-mode">
        <label><input type="radio" name="transport-mode" value="DRIVING" checked> 🚗 車</label>
        <label><input type="radio" name="transport-mode" value="WALKING"> 🚶 徒歩</label>
        <label><input type="radio" name="transport-mode" value="TRANSIT"> 🚌 公共交通機関</label>
      </div>
      
      <button id="route-search">経路検索</button>
      <button id="route-clear" class="secondary">クリア</button>
    </div>
    
    <!-- 地図表示領域 -->
    <div id="map"></div>
    
    <!-- 経路情報パネル -->
    <div id="route-info" class="route-info"></div>
  </div>

  <!-- JavaScript -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/map.js"></script>
  
  <!-- Google Maps API（APIキーをServerless APIから取得して動的に読み込む） -->
  <script>
    (function loadMapsApi() {
      fetch('/api/maps-key')
        .then(res => res.json())
        .then(({ key }) => {
          if (!key) throw new Error('API key missing');
          const s = document.createElement('script');
          s.async = true;
          s.defer = true;
          s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initMap&libraries=places&loading=async`;
          document.body.appendChild(s);
        })
        .catch(err => {
          console.error('Failed to load Google Maps API:', err);
          alert('Google Mapsの読み込みに失敗しました。環境変数設定とリファラー制限をご確認ください。');
        });
    })();
  </script>
  <script>
    // URLパラメータから地点情報を取得して地図上に表示
    function handleLocationFromURL() {
      const params = new URLSearchParams(window.location.search);
      const locationId = params.get('location');
      
      if (locationId && window.findItemById) {
        const item = window.findItemById(locationId);
        if (item && item.location && window.map) {
          window.map.setCenter({ 
            lat: item.location.lat, 
            lng: item.location.lng
          });
          window.map.setZoom(15);
          
          // 該当マーカーをハイライト（オプション）
          if (window.markers && window.markers.length > 0) {
            const marker = window.markers.find(m => 
              m.position.lat() === item.location.lat && 
              m.position.lng() === item.location.lng
            );
            if (marker) {
              // マーカーの情報ウィンドウを開く
              google.maps.event.trigger(marker, 'click');
            }
          }
        }
      }
    }

    // 地図初期化後にURLパラメータの地点を表示
    const originalInitMap = window.initMap;
    window.initMap = function() {
      if (originalInitMap) originalInitMap();
      
      // 地図が完全に読み込まれた後にURLパラメータを処理
      if (window.map) {
        window.map.addListener('tilesloaded', () => {
          handleLocationFromURL();
        });
        // すぐに実行する場合（地図が既に読み込まれている場合）
        setTimeout(handleLocationFromURL, 500);
      }
    };
  </script>
</body>
</html>
